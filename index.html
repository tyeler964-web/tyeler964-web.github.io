<!doctype html>

e('hidden');sessionStorage.setItem('sweetCoreAccess','1')}else document.getElementById('error').textContent='Incorrect access code.'}if(sessionStorage.getItem('sweetCoreAccess')==='1'){document.getElementById('gate').classList.add('hidden');document.getElementById('content').classList.remove('hidden')}document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});</script></body></html>
