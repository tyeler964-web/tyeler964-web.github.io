services:
  - type: web
    runtime: static
    name: firefly-studios
    branch: main
    buildCommand: echo "Firefly Studios static app — no build step required"
    staticPublishPath: .
    autoDeployTrigger: commit
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

  - type: web
    runtime: node
    name: paperlive-api
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_NAME
        value: PaperLive Bridge