name: PaperLive checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Validate backend JavaScript
        run: node --check server.js
      - name: Validate client JavaScript
        run: node --check client.js
      - name: Validate service worker
        run: node --check sw.js
